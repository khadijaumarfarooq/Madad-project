<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madad | Community Help Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css?v=vibrant">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="nav-container">
            <a href="#" class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-hand-holding-heart"></i>
                </div>
                <div>
                    <div class="brand-title">Madad</div>
                    <div class="brand-subtitle">Community Help Platform</div>
                </div>
            </a>
            
            <button id="openModalBtn" class="btn-primary">
                <i class="fa-solid fa-plus"></i>
                <span>Post Request</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main>
        <!-- Hero Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-layer-group"></i></div>
                <div>
                    <div class="stat-label">Total Requests</div>
                    <div id="statTotal" class="stat-value">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon open"><i class="fa-solid fa-clock"></i></div>
                <div>
                    <div class="stat-label">Open</div>
                    <div id="statOpen" class="stat-value">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon accepted"><i class="fa-solid fa-user-check"></i></div>
                <div>
                    <div class="stat-label">Accepted</div>
                    <div id="statAccepted" class="stat-value">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon completed"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <div class="stat-label">Completed</div>
                    <div id="statCompleted" class="stat-value">0</div>
                </div>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search requests by title or location..." class="search-input">
            </div>

            <div class="filter-group">
                <select id="categoryFilter" class="filter-select">
                    <option value="all">All Categories</option>
                    <option value="Blood Donation">Blood Donation</option>
                    <option value="Groceries & Errands">Groceries & Errands</option>
                    <option value="Elderly Support">Elderly Support</option>
                    <option value="Education / Tutoring">Education / Tutoring</option>
                    <option value="Other">Other</option>
                </select>

                <select id="statusFilter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="Open">Open</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
        </div>

        <!-- Dynamic Request Cards Area -->
        <div id="requestsContainer" class="requests-grid">
            <div class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                <p>No requests loaded yet. Click "Post Request" to create one!</p>
            </div>
        </div>
    </main>

    <!-- Post Help Request Modal -->
    <div id="requestModal" class="modal-backdrop">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-hand-holding-heart" style="color: var(--primary);"></i>
                    <span>Post a Help Request</span>
                </div>
                <button id="closeModalBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="requestForm">
                <div class="form-group">
                    <label class="form-label">Request Title</label>
                    <input type="text" id="reqTitle" required placeholder="e.g., Need O+ Blood Donor urgently" class="form-control">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="reqCategory" required class="form-control">
                            <option value="Blood Donation">Blood Donation</option>
                            <option value="Groceries & Errands">Groceries & Errands</option>
                            <option value="Elderly Support">Elderly Support</option>
                            <option value="Education / Tutoring">Education / Tutoring</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location / Area</label>
                        <input type="text" id="reqLocation" required placeholder="e.g., Latifabad, Hyderabad" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Your Name / Contact Info</label>
                    <input type="text" id="reqAuthor" required placeholder="e.g., Ahmed Khan (0300-1234567)" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="reqDescription" rows="3" required placeholder="Provide details about what help is needed..." class="form-control"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Submit Request</button>
                <!-- </div> -->
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Madad Community Platform &copy; 2026. Built to bring communities closer.</p>
    </footer>

    <!-- Modal Toggle Script -->
    <script>
        const modal = document.getElementById('requestModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelModalBtn');

        const openModal = () => modal.classList.add('active');
        const closeModal = () => modal.classList.remove('active');

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
    <!-- Main App Script -->
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
